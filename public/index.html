<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Diversão com os amigos</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #020617; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 20px 14px; background: radial-gradient(ellipse at top, #312e8155, #020617 55%); }
    main { width: min(100%, 760px); margin: 0 auto; }
    header, .center { text-align: center; }
    .panel { padding: 22px; border: 1px solid #ffffff20; border-radius: 22px; background: #0f172a; margin: 14px 0; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 7vw, 3rem); }
    h2 { margin: 8px 0; }
    p { line-height: 1.5; }
    .muted { color: #94a3b8; }
    input, button { width: 100%; border-radius: 13px; padding: 13px 15px; font: inherit; }
    input { color: white; background: #020617; border: 1px solid #ffffff25; }
    button { border: 0; cursor: pointer; font-weight: 750; color: white; background: #7c3aed; margin-top: 8px; }
    button.secondary { background: #1e293b; border: 1px solid #ffffff20; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .game-card { padding: 16px; min-height: 115px; text-align: left; background: #111c31; border: 1px solid #ffffff20; }
    .game-card.selected { outline: 2px solid #a78bfa; background: #252044; }
    .hidden { display: none !important; }
    .room-player { padding: 10px 12px; border-radius: 10px; background: #020617; margin: 6px 0; }
    .notice { padding: 12px; border-radius: 12px; background: #312e81; margin: 10px 0; }
    .answers { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; }
    .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .keyboard button { padding: 10px 2px; margin: 0; }
    .word { font-size: clamp(1.4rem, 7vw, 2.3rem); letter-spacing: .25em; text-align: center; overflow-wrap: anywhere; }
    .hangman { font-size: 1.2rem; line-height: 1.8; }
    @media (max-width: 460px) { .answers { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <div aria-hidden="true" style="font-size:2.5rem">🎮</div>
    <p class="muted">DIVERSÃO COM OS AMIGOS</p>
    <h1>Escolha sua diversão</h1>
  </header>

  <section id="entry" class="panel">
    <label for="name">Seu nome</label>
    <input id="name" maxlength="16" placeholder="Digite seu nome" autocomplete="nickname">
    <p id="error" class="muted" role="status"></p>
    <h2>Selecione um jogo</h2>
    <div id="games" class="grid"></div>
    <div id="entryActions" class="hidden">
      <button id="publicBtn">Entrar em sala pública</button>
      <button id="soloBtn" class="secondary">Jogar contra a máquina</button>
      <button id="privateBtn" class="secondary">Criar sala privada e convidar</button>
      <div id="publicRoomList"></div>
      <form id="codeForm">
        <label for="code">Entrar em sala privada com código</label>
        <input id="code" maxlength="6" placeholder="Código do convite">
        <button class="secondary" type="submit">Entrar na sala</button>
      </form>
    </div>
  </section>

  <section id="lobby" class="panel hidden">
    <p class="muted" id="roomLabel"></p>
    <h2 id="roomTitle">Sala</h2>
    <div id="players"></div>
    <p id="roomStatus" class="notice"></p>
    <button id="completeBotsBtn" class="hidden">Completar com Bots (NPCs)</button>
    <button id="startBtn" class="hidden">Iniciar partida</button>
    <button id="shareBtn" class="secondary hidden">Compartilhar convite</button>
    <button id="backBtn" class="secondary">Sair da sala</button>
  </section>

  <section id="game" class="panel hidden">
    <div id="gameMount"></div>
    <button id="leaveGameBtn" class="secondary">Voltar ao lobby</button>
  </section>
</main>

<script>
"use strict";

const gameCatalog = [
  { name: "Par ou Ímpar", icon: "🪙", description: "Escolham números de 1 a 9; vence o resultado da soma." },
  { name: "Jokenpô", icon: "✊", description: "Pedra, papel e tesoura." },
  { name: "Detetive", icon: "🕵️", description: "Investigue o mistério em grupo." },
  { name: "Jogo da Forca", icon: "🔤", description: "Adivinhe a palavra com seu grupo." },
  { name: "Stop", icon: "📝", description: "Preencha as categorias antes dos outros." }
];

const $ = (id) => document.getElementById(id);
let socket;
let playerName = "";
let selectedGame = "";
let currentRoom = null;
let lastGameState = null;

function showError(text) {
  $("error").textContent = text || "";
}

function connect() {
  const protocol = location.protocol === "https:" ? "wss://" : "ws://";
  socket = new WebSocket(protocol + location.host + "/ws");

  socket.addEventListener("open", () => {
    const inviteCode = new URLSearchParams(location.search).get("sala");
    const inviteGame = new URLSearchParams(location.search).get("jogo");
    if (inviteCode && inviteGame && gameCatalog.some((item) => item.name === inviteGame)) {
      selectedGame = inviteGame;
      document.querySelectorAll(".game-card").forEach((card) => {
        card.classList.toggle("selected", card.dataset.game === inviteGame);
      });
      $("entryActions").classList.remove("hidden");
      showError("Convite detectado. Digite seu nome e entre diretamente na sala.");
    }
  });

  socket.addEventListener("message", (event) => {
    let message;
    try { message = JSON.parse(event.data); } catch { return; }

    if (message.t === "error") {
      showError(message.message);
    } else if (message.t === "publicRooms") {
      renderPublicRooms(message.rooms || []);
    } else if (message.t === "room") {
      currentRoom = message.room;
      renderRoom();
      if (currentRoom.started) renderGame();
      else {
        $("lobby").classList.remove("hidden");
        $("game").classList.add("hidden");
      }
    }
  });
}
connect();

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(message));
  } else {
    showError("Conectando ao servidor. Tente novamente em instantes.");
  }
}

function renderCatalog() {
  const root = $("games");
  gameCatalog.forEach((game) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "game-card";
    button.dataset.game = game.name;
    button.innerHTML = "<strong>" + game.icon + " " + game.name + "</strong><br><span class=\"muted\">" + game.description + "</span>";
    button.addEventListener("click", () => {
      selectedGame = game.name;
      document.querySelectorAll(".game-card").forEach((card) => card.classList.remove("selected"));
      button.classList.add("selected");
      $("entryActions").classList.remove("hidden");
      send({ t: "publicRooms", game: selectedGame });
      showError("");
    });
    root.appendChild(button);
  });
}
renderCatalog();

function selectedName() {
  playerName = $("name").value.trim();
  if (!playerName) {
    showError("Digite seu nome para continuar.");
    $("name").focus();
    return false;
  }
  if (!selectedGame) {
    showError("Selecione um jogo.");
    return false;
  }
  return true;
}

$("publicBtn").addEventListener("click", () => {
  if (selectedName()) send({ t: "joinPublic", name: playerName, game: selectedGame });
});

$("soloBtn").addEventListener("click", () => {
  if (!selectedName()) return;
  send({ t: "createPrivate", name: playerName, game: selectedGame });
  showError("Criando partida solo. Quando a sala abrir, use “Completar com Bots (NPCs)” e inicie.");
});

$("privateBtn").addEventListener("click", () => {
  if (selectedName()) send({ t: "createPrivate", name: playerName, game: selectedGame });
});

$("codeForm").addEventListener("submit", (event) => {
  event.preventDefault();
  if (!selectedName()) return;
  const code = $("code").value.trim().toUpperCase();
  if (!code) return showError("Digite o código da sala.");
  send({ t: "joinPrivate", name: playerName, code });
});

function renderPublicRooms(rooms) {
  const root = $("publicRoomList");
  root.replaceChildren();
  if (!rooms.length) {
    const note = document.createElement("p");
    note.className = "muted";
    note.textContent = "Nenhuma sala pública aberta agora. Ao entrar, você será colocado em uma sala de matchmaking.";
    root.appendChild(note);
    return;
  }

  const title = document.createElement("p");
  title.textContent = "Salas públicas disponíveis:";
  root.appendChild(title);

  rooms.forEach((room) => {
    const button = document.createElement("button");
    button.className = "secondary";
    button.type = "button";
    button.textContent = room.players.join(", ") + " · código " + room.code;
    button.addEventListener("click", () => {
      if (selectedName()) send({ t: "joinPublic", name: playerName, game: selectedGame });
    });
    root.appendChild(button);
  });
}

function renderRoom() {
  const room = currentRoom;
  if (!room) return;

  $("entry").classList.add("hidden");
  $("lobby").classList.remove("hidden");
  $("game").classList.add("hidden");
  $("roomTitle").textContent = room.game;
  $("roomLabel").textContent = (room.mode === "private" ? "Sala privada" : "Sala pública") + " · Código: " + room.code;

  const list = $("players");
  list.replaceChildren();
  room.players.forEach((player) => {
    const item = document.createElement("div");
    item.className = "room-player";
    item.textContent = player.name + (player.host ? " · anfitrião" : "") + (player.bot ? " · NPC" : "");
    list.appendChild(item);
  });

  const isHost = room.players.some((player) => player.host && !player.bot && player.name === playerName);
  const botCount = room.players.filter((player) => player.bot).length;
  const missing = Math.max(0, room.minPlayers - room.players.length);

  $("roomStatus").textContent = room.started
    ? "Partida iniciada."
    : "Jogadores: " + room.players.length + "/" + room.maxPlayers +
      " · mínimo para iniciar: " + room.minPlayers +
      (missing ? " · faltam " + missing + " vaga(s)." : " · partida pronta para iniciar.");

  $("completeBotsBtn").classList.toggle("hidden", room.started || !isHost || missing === 0);
  $("startBtn").classList.toggle("hidden", room.started || !isHost || room.players.length < room.minPlayers);
  $("shareBtn").classList.toggle("hidden", room.mode !== "private");
  $("completeBotsBtn").textContent = "Completar com Bots (NPCs)" + (botCount ? " · " + botCount + " adicionado(s)" : "");
}

$("completeBotsBtn").addEventListener("click", () => send({ t: "completeWithBots" }));
$("startBtn").addEventListener("click", () => send({ t: "start" }));
$("shareBtn").addEventListener("click", async () => {
  if (!currentRoom) return;
  const url = new URL(location.href);
  url.searchParams.set("sala", currentRoom.code);
  url.searchParams.set("jogo", currentRoom.game);
  const text = "Vamos jogar " + currentRoom.game + "? Entre direto na minha sala: " + url.toString();
  try {
    if (navigator.share) await navigator.share({ title: "Convite para jogar", text, url: url.toString() });
    else await navigator.clipboard.writeText(text);
  } catch {
    showError("Não foi possível compartilhar automaticamente. Código da sala: " + currentRoom.code);
  }
});
$("backBtn").addEventListener("click", () => {
  send({ t: "leave" });
  currentRoom = null;
  $("lobby").classList.add("hidden");
  $("game").classList.add("hidden");
  $("entry").classList.remove("hidden");
});
$("leaveGameBtn").addEventListener("click", () => {
  $("game").classList.add("hidden");
  $("lobby").classList.remove("hidden");
});

/* Contrato modular: cada módulo só renderiza seu próprio jogo e envia suas ações. */
window.GameModules = {
  "Jogo da Forca": {
    render(root, room, sendAction) {
      const state = room.gameState;
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const masked = [...state.word].map((letter) => state.guessed.includes(letter) ? letter : "_").join(" ");
      const active = room.players[state.turn];

      root.innerHTML =
        "<h2>Jogo da Forca</h2>" +
        "<p class=\"muted\">Vez de: " + (active ? active.name : "—") + "</p>" +
        "<p class=\"hangman\">Erros: " + state.mistakes + "/" + state.maxMistakes + "</p>" +
        "<p class=\"word\">" + masked + "</p>" +
        "<p class=\"muted\">Letras tentadas: " + (state.guessed.join(", ") || "nenhuma") + "</p>";

      if (state.phase === "result") {
        const result = document.createElement("p");
        result.className = "notice";
        result.textContent = state.result.message + " Palavra: " + state.result.word;
        root.appendChild(result);
        return;
      }

      const keyboard = document.createElement("div");
      keyboard.className = "keyboard";
      letters.forEach((letter) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = letter;
        button.disabled = state.guessed.includes(letter) || !active || active.name !== playerName;
        button.addEventListener("click", () => sendAction({ t: "hangmanGuess", letter }));
        keyboard.appendChild(button);
      });
      root.appendChild(keyboard);
    }
  },

  "Stop": {
    render(root, room, sendAction) {
      const state = room.gameState;
      root.innerHTML =
        "<h2>Stop</h2>" +
        "<p class=\"notice\">Letra da rodada: <strong>" + state.letter + "</strong></p>";

      if (state.phase === "result") {
        const result = state.result;
        const summary = document.createElement("div");
        summary.className = "panel";
        summary.innerHTML = "<h3>Resultado da rodada</h3>";
        result.submissions.forEach((entry) => {
          const row = document.createElement("p");
          row.textContent = entry.name + (entry.bot ? " (NPC)" : "") + " — " +
            entry.answers.map((answer) => answer || "—").join(" · ") +
            " · " + (result.scores[entry.playerId] || 0) + " pontos";
          summary.appendChild(row);
        });
        root.appendChild(summary);
        return;
      }

      const form = document.createElement("form");
      form.className = "answers";
      const fields = [];
      state.categories.forEach((category) => {
        const label = document.createElement("label");
        label.textContent = category;
        const input = document.createElement("input");
        input.maxLength = 40;
        input.required = false;
        input.placeholder = "Começa com " + state.letter;
        form.append(label, input);
        fields.push(input);
      });
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.textContent = "Enviar respostas";
      submit.style.gridColumn = "1 / -1";
      form.appendChild(submit);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendAction({ t: "stopSubmit", answers: fields.map((field) => field.value) });
        submit.disabled = true;
        submit.textContent = "Respostas enviadas — aguardando a sala";
      });
      root.appendChild(form);
    }
  },

  "Par ou Ímpar": {
    render(root, room, sendAction) {
      const state = room.gameState;
      root.innerHTML = "<h2>Par ou Ímpar</h2>";
      if (state.phase === "result") {
        root.innerHTML += "<p class=\"notice\">Soma: " + state.result.sum + " · Deu " + state.result.parity + "</p>";
        return;
      }
      const form = document.createElement("form");
      const input = document.createElement("input");
      input.type = "number";
      input.min = "1";
      input.max = "9";
      input.placeholder = "Escolha um número de 1 a 9";
      const button = document.createElement("button");
      button.textContent = "Enviar número";
      form.append(input, button);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendAction({ t: "parityPlay", number: Number(input.value) });
        button.disabled = true;
      });
      root.appendChild(form);
    }
  }
};

function renderGame() {
  if (!currentRoom || !currentRoom.started) return;
  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");

  const root = $("gameMount");
  const module = window.GameModules[currentRoom.game];
  if (!module) {
    root.innerHTML = "<h2>" + currentRoom.game + "</h2><p class=\"notice\">O módulo deste jogo ainda precisa ser implementado. O lobby e as salas já estão prontos para receber sua interface.</p>";
    return;
  }
  module.render(root, currentRoom, send);
}

$("name").addEventListener("input", () => {
  const inviteCode = new URLSearchParams(location.search).get("sala");
  if (inviteCode) $("code").value = inviteCode;
});

const initialCode = new URLSearchParams(location.search).get("sala");
if (initialCode) $("code").value = initialCode;
</script>
</body>
</html>
